<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Who Stole the Money</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --pointer-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        header {
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sound-toggle {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: var(--card-bg);
            border: 1px solid #334155;
            color: var(--text-muted);
            padding: 0.5rem;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            transition: all 0.2s ease;
        }

        .sound-toggle:hover {
            color: var(--text-color);
            border-color: var(--accent-color);
        }

        .wheel-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            max-width: 420px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Pointer at Top */
        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 38px;
            z-index: 10;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.4));
        }

        .pointer::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 16px solid transparent;
            border-right: 16px solid transparent;
            border-top: 32px solid var(--pointer-color);
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 0 15px rgba(99, 102, 241, 0.2);
        }

        .controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .spin-btn {
            background: linear-gradient(135deg, var(--accent-color) 0%, var(--accent-hover) 100%);
            color: white;
            border: none;
            padding: 1rem 3.5rem;
            font-size: 1.25rem;
            font-weight: 700;
            border-radius: 9999px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
            transition: transform 0.1s ease, box-shadow 0.2s ease, opacity 0.2s ease;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .spin-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }

        .spin-btn:active:not(:disabled) {
            transform: translateY(1px);
        }

        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Modal Overlay for Result */
        .result-modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 50;
        }

        .result-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: var(--card-bg);
            border: 1px solid #334155;
            padding: 2rem;
            border-radius: 1.5rem;
            text-align: center;
            max-width: 360px;
            width: 100%;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .result-modal.active .modal-card {
            transform: scale(1);
        }

        .modal-subtitle {
            color: var(--text-muted);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
        }

        .modal-title {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text-color);
            margin-bottom: 1.5rem;
            word-break: break-word;
        }

        .close-btn {
            background: #334155;
            color: var(--text-color);
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .close-btn:hover {
            background: #475569;
        }
    </style>
</head>
<body>

    <button class="sound-toggle" id="soundToggle" aria-label="Toggle Sound">
        <svg id="soundIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
    </button>

    <div class="container">
        <header>
            <h1>Who Stole the Money</h1>
        </header>

        <div class="wheel-container">
            <div class="pointer"></div>
            <canvas id="wheelCanvas" width="800" height="800"></canvas>
        </div>

        <div class="controls">
            <button class="spin-btn" id="spinBtn">SPIN</button>
        </div>
    </div>

    <!-- Result Modal -->
    <div class="result-modal" id="resultModal">
        <div class="modal-card">
            <div class="modal-subtitle">Selected Result</div>
            <div class="modal-title" id="resultText">-</div>
            <button class="close-btn" id="closeModalBtn">Spin Again</button>
        </div>
    </div>

    <script>
        // ==========================================
        // WHEEL CONFIGURATION (Edit Options Here)
        // ==========================================
        const options = [
            "Jamal",
            "Option 2",
            "Option 3",
            "Option 4",
            "Option 5",
            "Option 6"
        ];

        // Color Palette for Slices
        const sliceColors = [
            "#6366f1", "#ec4899", "#8b5cf6", 
            "#10b981", "#f59e0b", "#3b82f6", 
            "#14b8a6", "#f43f5e"
        ];

        // ==========================================
        // STATE & INITIALIZATION
        // ==========================================
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const resultModal = document.getElementById('resultModal');
        const resultText = document.getElementById('resultText');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const soundToggle = document.getElementById('soundToggle');

        let soundEnabled = true;
        let currentRotation = 0; // In radians
        let isSpinning = false;
        let audioCtx = null;

        const numOptions = options.length;
        const sliceAngle = (2 * Math.PI) / numOptions;

        // Web Audio Synthesizer for Click & Win Sounds
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playClickSound() {
            if (!soundEnabled || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.04);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.04);
        }

        function playWinSound() {
            if (!soundEnabled || !audioCtx) return;
            const now = audioCtx.currentTime;
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + i * 0.08);
                gain.gain.setValueAtTime(0.2, now + i * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + i * 0.08);
                osc.stop(now + i * 0.08 + 0.3);
            });
        }

        // ==========================================
        // DRAWING THE WHEEL
        // ==========================================
        function drawWheel() {
            const width = canvas.width;
            const height = canvas.height;
            const radius = width / 2;
            const centerX = width / 2;
            const centerY = height / 2;

            ctx.clearRect(0, 0, width, height);

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(currentRotation);

            // Draw Slices
            for (let i = 0; i < numOptions; i++) {
                const angle = i * sliceAngle;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius - 10, angle, angle + sliceAngle);
                ctx.closePath();

                ctx.fillStyle = sliceColors[i % sliceColors.length];
                ctx.fill();
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#0f172a';
                ctx.stroke();

                // Draw Text
                ctx.save();
                ctx.rotate(angle + sliceAngle / 2);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 28px system-ui, sans-serif';
                ctx.fillText(options[i], radius - 40, 0);
                ctx.restore();
            }

            // Draw Center Cap
            ctx.beginPath();
            ctx.arc(0, 0, 50, 0, 2 * Math.PI);
            ctx.fillStyle = '#1e293b';
            ctx.fill();
            ctx.lineWidth = 6;
            ctx.strokeStyle = '#6366f1';
            ctx.stroke();

            ctx.restore();
        }

        // ==========================================
        // ANIMATION & LOGIC
        // ==========================================
        let lastPegIndex = -1;

        function spin() {
            if (isSpinning) return;
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            isSpinning = true;
            spinBtn.disabled = true;

            // Forced Winning Target: "Jamal"
            let winningIndex = options.indexOf("Jamal");
            if (winningIndex === -1) {
                winningIndex = 0; // Fallback if name is edited out
            }

            // Calculate Target Rotation
            const extraRounds = 5 + Math.floor(Math.random() * 3); // 5 to 7 full rotations
            
            // Slice center angle offset relative to wheel standard orientation
            const sliceCenterAngle = (winningIndex + 0.5) * sliceAngle;
            
            // Align sliceCenterAngle with -PI/2 (top pointer)
            const targetRotation = (3 * Math.PI / 2) - sliceCenterAngle + (extraRounds * 2 * Math.PI);

            const startRotation = currentRotation % (2 * Math.PI);
            const totalRotationNeeded = targetRotation - startRotation;

            const duration = 4500; // 4.5 seconds animation
            const startTime = performance.now();

            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);

                // Cubic Easing Out
                const easeOut = 1 - Math.pow(1 - progress, 3);
                currentRotation = startRotation + totalRotationNeeded * easeOut;

                // Sound tick calculation
                const effectiveAngle = (3 * Math.PI / 2 - currentRotation) % (2 * Math.PI);
                const positiveAngle = (effectiveAngle + 2 * Math.PI) % (2 * Math.PI);
                const currentPegIndex = Math.floor(positiveAngle / sliceAngle);

                if (currentPegIndex !== lastPegIndex) {
                    playClickSound();
                    lastPegIndex = currentPegIndex;
                }

                drawWheel();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    spinBtn.disabled = false;
                    playWinSound();
                    showResult(options[winningIndex]);
                }
            }

            requestAnimationFrame(animate);
        }

        function showResult(text) {
            resultText.textContent = text;
            resultModal.classList.add('active');
        }

        function closeModal() {
            resultModal.classList.remove('active');
        }

        // ==========================================
        // EVENT LISTENERS
        // ==========================================
        spinBtn.addEventListener('click', spin);
        closeModalBtn.addEventListener('click', closeModal);
        resultModal.addEventListener('click', (e) => {
            if (e.target === resultModal) closeModal();
        });

        soundToggle.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundToggle.style.opacity = soundEnabled ? '1' : '0.4';
        });

        // Draw initial state
        drawWheel();
    </script>
</body>
</html>
